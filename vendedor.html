
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUACHI APP - Minha Loja</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101010;
  color: white;
}

header {
  background: #000;
  padding: 22px;
  text-align: center;
  border-bottom: 2px solid #c9a227;
}

header h1 {
  color: #d4af37;
  letter-spacing: 3px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h2 {
  color: #d4af37;
}

.card {
  background: #1d1d1d;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  border: 1px solid #555;
  border-radius: 7px;
  background: #292929;
  color: white;
}

button {
  width: 100%;
  padding: 14px;
  background: #d4af37;
  color: black;
  border: none;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.produto {
  background: #292929;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
}

.produto img {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: 8px;
}

.preco {
  color: #d4af37;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>MUACHI APP</h1>
  <p>A tua loja, o teu negócio, o teu futuro.</p>
</header>

<div class="container">

  <div class="card">
    <h2>Criar minha loja</h2>

    <input id="loja" placeholder="Nome da loja">

    <select id="categoria">
      <option value="">Escolher categoria</option>
      <option>Moda</option>
      <option>Tecnologia</option>
      <option>Calçado</option>
      <option>Acessórios</option>
      <option>Alimentação</option>
      <option>Imóveis</option>
      <option>Veículos</option>
      <option>Serviços</option>
    </select>

    <input id="telefone" placeholder="WhatsApp (ex: 244923000000)">

    <button onclick="criarLoja()">CRIAR MINHA LOJA</button>

    <p id="mensagemLoja"></p>
  </div>

  <div class="card">
    <h2>Publicar produto</h2>

    <input id="nomeProduto" placeholder="Nome do produto">

    <textarea id="descricao" placeholder="Descrição do produto"></textarea>

    <input id="preco" type="number" placeholder="Preço em Kz">

    <input id="foto" type="file" accept="image/*">

    <button onclick="publicarProduto()">PUBLICAR PRODUTO</button>
  </div>

  <div class="card">
    <h2>Minha loja</h2>
    <div id="dadosLoja">Ainda não criaste uma loja.</div>
  </div>

  <div class="card">
    <h2>Meus produtos</h2>
    <div id="produtos">Ainda não existem produtos publicados.</div>
  </div>

</div>

<script>
let lojaAtual = JSON.parse(
  localStorage.getItem("muachiLoja") || "null"
);

let produtos = JSON.parse(
  localStorage.getItem("muachiProdutos") || "[]"
);

function mostrarLoja() {
  if (lojaAtual) {
    document.getElementById("dadosLoja").innerHTML =
      "<h3>" + escapar(lojaAtual.nome) + "</h3>" +
      "<p>Categoria: " + escapar(lojaAtual.categoria) + "</p>" +
      "<p>WhatsApp: " + escapar(lojaAtual.telefone) + "</p>";
  }

  mostrarProdutos();
}

function criarLoja() {
  const nome = document.getElementById("loja").value.trim();
  const categoria = document.getElementById("categoria").value;
  const telefone = document.getElementById("telefone").value.trim();

  if (!nome || !categoria || !telefone) {
    alert("Preenche todos os campos!");
    return;
  }

  lojaAtual = { nome, categoria, telefone };

  localStorage.setItem("muachiLoja", JSON.stringify(lojaAtual));

  document.getElementById("mensagemLoja").textContent =
    "Loja criada com sucesso!";

  mostrarLoja();
}

function escapar(valor) {
  const div = document.createElement("div");
  div.textContent = String(valor);
  return div.innerHTML;
}

function publicarProduto() {
  if (!lojaAtual) {
    alert("Primeiro cria a tua loja!");
    return;
  }

  const nome = document.getElementById("nomeProduto").value.trim();
  const descricao = document.getElementById("descricao").value.trim();
  const preco = Number(document.getElementById("preco").value);
  const ficheiro = document.getElementById("foto").files[0];

  if (!nome || !descricao || !preco || preco <= 0 || !ficheiro) {
    alert("Preenche todos os campos e escolhe uma fotografia!");
    return;
  }

  if (!ficheiro.type.startsWith("image/")) {
    alert("Escolhe uma imagem válida!");
    return;
  }

  if (ficheiro.size > 2 * 1024 * 1024) {
    alert("A fotografia deve ter no máximo 2 MB.");
    return;
  }

  const leitor = new FileReader();

  leitor.onload = function(e) {
    const produto = {
      nome,
      descricao,
      preco,
      foto: e.target.result
    };

    produtos.push(produto);

    try {
      localStorage.setItem("muachiProdutos", JSON.stringify(produtos));
    } catch (erro) {
      produtos.pop();
      alert("Espaço de armazenamento insuficiente. Reduz o tamanho das fotografias.");
      return;
    }

    document.getElementById("nomeProduto").value = "";
    document.getElementById("descricao").value = "";
    document.getElementById("preco").value = "";
    document.getElementById("foto").value = "";

    mostrarProdutos();
    alert("Produto publicado com sucesso!");
  };

  leitor.readAsDataURL(ficheiro);
}

function mostrarProdutos() {
  const area = document.getElementById("produtos");

  if (produtos.length === 0) {
    area.textContent = "Ainda não existem produtos publicados.";
    return;
  }

  area.innerHTML = "";

  produtos.forEach(p => {
    const div = document.createElement("div");
    div.className = "produto";

    const img = document.createElement("img");
    img.src = p.foto;
    img.alt = p.nome;

    const titulo = document.createElement("h3");
    titulo.textContent = p.nome;

    const descricao = document.createElement("p");
    descricao.textContent = p.descricao;

    const preco = document.createElement("p");
    preco.className = "preco";
    preco.textContent = p.preco.toLocaleString("pt-PT") + " Kz";

    div.append(img, titulo, descricao, preco);
    area.appendChild(div);
  });
}

mostrarLoja();
</script>

</body>
  </html>
